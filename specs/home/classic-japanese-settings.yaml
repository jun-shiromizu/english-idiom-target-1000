feature: トップページ - 古文単語330の出題設定
action: classic-japanese-settings
page: "#/"

scenarios:
  - id: HOME-015
    category: normal
    status: done
    scenario: 非対応アクションから古文単語330へ切り替えると単語帳と古文 → 現代語に変更され、非対応の選択肢が無効になる
    precondition: localStorage がクリアな状態
    steps:
      - アプリのトップページを開く
      - アクションで「書き取り」を選択する
      - 教材で「古文単語330」を選択する
    expect:
      - アクションで「単語帳」が選択される
      - 「書き取り」「例文穴埋め」「タイピング」「ゲーム」「バトル」が選択できない
      - 出題形式に「見出し語」と「例文」が表示される
      - 出題方向で「古文 → 現代語」が選択され、「現代語 → 古文」が選択できない
      - 「古文単語330は単語帳（古文 → 現代語）のみ対応しています。」が表示される
      - 「アクションを単語帳、出題方向を古文 → 現代語に変更しました。」を含む通知が表示される

  - id: HOME-016
    category: normal
    status: done
    scenario: 古文単語330の見出し語で開始すると一覧と対象データを取得し、古文の session を保存して出題画面へ遷移する
    precondition: 古文単語330の一覧と 0001.json（見出し語2件）、0002.json（見出し語1件）がモックされた状態
    steps:
      - アプリのトップページを開く
      - 教材で「古文単語330」を選択する
      - 開始番号に「1」、終了番号に「2」を入力する
      - 「開始」ボタンをクリックする
    expect:
      - 出題画面（#/quiz）へ遷移する
      - 古文単語330の一覧と 0001.json、0002.json の取得先が要求される
      - 画像ファイルは要求されない
      - 教材「classic-japanese-330」、出題方向「classic-to-modern」の session に3問が保存される

  - id: HOME-017
    category: normal
    status: done
    scenario: 古文単語330の保存済み session があると再開バナーに教材名と進捗が表示され、データを再取得せずに再開できる
    precondition: 2問中1問に回答済みの古文単語330の中断セッションが保存されている状態
    steps:
      - アプリのトップページを開く
      - 再開バナーの「再開する」ボタンをクリックする
    expect:
      - 再開バナーに「古文単語330 / 1 / 2問目」が表示される
      - 出題画面（#/quiz）へ遷移し、2問目の見出し語が表示される
      - 古文単語330のデータは再取得されない

  - id: HOME-201
    category: error
    status: done
    scenario: 指定範囲のデータが一覧にない場合は番号を含むエラーを表示し、既存の中断セッションを維持する
    precondition: 古文単語330の一覧に 0001.json だけが存在し、英熟語ターゲット1000の中断セッションが保存されている状態
    steps:
      - アプリのトップページを開く
      - 教材で「古文単語330」を選択する
      - 開始番号に「1」、終了番号に「2」を入力する
      - 「開始」ボタンをクリックする
    expect:
      - 「古文単語330の No.0002 のデータが見つかりません。」が表示される
      - トップページにとどまる
      - 保存済みの英熟語ターゲット1000の session が変更されない

  - id: HOME-202
    category: error
    status: done
    scenario: 古文データの形式が不正な場合は番号と項目を含むエラーを表示し、出題画面へ遷移しない
    precondition: 古文単語330の 0001.json の意味が空配列でモックされた状態
    steps:
      - アプリのトップページを開く
      - 教材で「古文単語330」を選択する
      - 開始番号に「1」、終了番号に「1」を入力する
      - 「開始」ボタンをクリックする
    expect:
      - 「古文単語330の No.0001 のデータ形式が不正です（means: 1件以上必要です）。」が表示される
      - トップページにとどまり、session は保存されない

  - id: HOME-203
    category: error
    status: done
    scenario: 古文単語330の session が保存された状態で英語専用の画面を開くと、データを残したままトップへ戻る
    precondition: 古文単語330の中断セッションが保存されている状態
    steps:
      - 書き取り画面（#/dictation）を直接開く
    expect:
      - トップページ（#/）へ戻る
      - 「古文単語330は書き取りに対応していないため、トップへ戻りました。保存中の古文単語帳のデータは削除していません。」が表示される
      - 古文単語330の session が保存されたままになる

  - id: HOME-204
    category: error
    status: done
    scenario: 古文単語330を選択中に保存済みバトルなしでバトル画面を直接開くと、新規バトルを開始させずにトップへ戻る
    precondition: localStorage がクリアな状態（バトルの中断データがない）
    steps:
      - アプリのトップページを開く
      - 教材で「古文単語330」を選択する
      - デッキ作成画面（#/battle/deck）を直接開く
    expect:
      - トップページ（#/）へ戻る
      - 「古文単語330はバトルに対応していないため、トップへ戻りました。バトルを始める場合は英語教材を選択してください。」が表示される
      - バトルの中断データは保存されない

  - id: HOME-303
    category: boundary
    status: done
    scenario: 古文単語330では 1〜330 番の範囲だけで開始できる
    precondition: localStorage がクリアな状態
    steps:
      - アプリのトップページを開く
      - 教材で「古文単語330」を選択する
      - 開始番号に「330」、終了番号に「330」を入力する
      - 終了番号に「331」を入力する
      - 終了番号に「330」、開始番号に「0」を入力する
    expect:
      - 「330」〜「330」では「開始」ボタンが有効になる
      - 終了番号が「331」のとき「開始」ボタンが無効になる
      - 開始番号が「0」のとき「開始」ボタンが無効になる

  - id: HOME-304
    category: boundary
    status: done
    scenario: 英単語ターゲット1900で 330 超の番号を入力後に古文単語330へ切り替えると 330 に補正される
    precondition: localStorage がクリアな状態
    steps:
      - アプリのトップページを開く
      - 教材で「英単語ターゲット1900」を選択する
      - 開始番号に「1500」、終了番号に「1900」を入力する
      - 教材で「古文単語330」を選択する
    expect:
      - 開始番号が「330」に補正される
      - 終了番号が「330」に補正される
