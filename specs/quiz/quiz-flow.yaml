feature: 通常クイズ - 回答から結果表示
action: quiz-flow
page: "#/quiz"

scenarios:
  - id: QUIZ-001
    category: normal
    status: done
    scenario: 2問に回答すると結果画面に正解数と正解率が表示される
    precondition: 2問の通常クイズ session が保存されている状態
    steps:
      - 通常クイズ画面を開く
      - 1問目の問題カードをクリックして回答を表示する
      - 「正解」ボタンをクリックする
      - 2問目の問題カードをクリックして回答を表示する
      - 「不正解」ボタンをクリックする
    expect:
      - 結果画面（#/result）へ遷移する
      - 2問中1問正解、正解率50%が表示される
      - 回答結果が保存されている

  - id: QUIZ-002
    category: regression
    status: done
    scenario: タッチ開始座標が0でもスワイプを判定し縦移動は回答にしない
    precondition: 2問の通常クイズ session が保存されている状態
    steps:
      - モバイル相当の画面幅で通常クイズ画面を開く
      - 1問目の回答を表示し、縦方向に移動する
      - 縦移動では回答が判定されないことを確認する
      - 画面上端から左へスワイプする
      - 2問目へ進み、不正解として保存されていることを確認する
      - 2問目を表示し、右へスワイプする
    expect:
      - 縦移動で回答結果が更新されない
      - 左スワイプで不正解として次の問題へ進む
      - 右スワイプで正解として結果画面へ進む