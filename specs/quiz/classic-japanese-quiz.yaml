feature: 単語帳 - 古文単語330の回答から結果表示
action: classic-japanese-quiz
page: "#/quiz"

scenarios:
  - id: QUIZ-004
    category: normal
    status: done
    scenario: 古文単語330の見出し語問題で回答を表示すると全ての意味・例文・POINT・出典ページが表示される
    precondition: 古文単語330の 0001.json（見出し語1件、意味2件、例文計3件、POINT、重複する出典ページ）がモックされた状態
    steps:
      - アプリのトップページを開く
      - 教材で「古文単語330」を選択する
      - 開始番号に「1」、終了番号に「1」を入力する
      - 「開始」ボタンをクリックする
      - 問題カードをクリックして回答を表示する
    expect:
      - 問題に見出し語と「意味を2つ答えてください」が表示される
      - 回答に2つの意味、3つの例文と現代語訳、POINT が表示される
      - 出典ページに「p.28、p.29」が表示される
      - 画像ファイルは要求されない

  - id: QUIZ-005
    category: normal
    status: done
    scenario: 古文単語330の例文形式では意味と例文の組ごとに出題され、回答に現代語訳と該当する意味が表示される
    precondition: 古文単語330の 0001.json（意味2件、例文計3件）がモックされた状態
    steps:
      - アプリのトップページを開く
      - 教材で「古文単語330」を選択する
      - 出題形式で「例文」を選択する
      - 開始番号に「1」、終了番号に「1」を入力する
      - 「開始」ボタンをクリックする
      - 問題カードをクリックして回答を表示する
    expect:
      - session に3問が保存される
      - 問題に1件目の例文が表示される
      - 回答に現代語訳と「1. 」から始まる該当する意味が表示される

  - id: QUIZ-006
    category: normal
    status: done
    scenario: 古文単語330の全問に回答すると結果画面に正解率が表示され、間違えた問題だけ再挑戦できる
    precondition: 古文単語330の 0001.json（見出し語2件）がモックされた状態
    steps:
      - アプリのトップページを開く
      - 教材で「古文単語330」を選択する
      - 開始番号に「1」、終了番号に「1」を入力する
      - 「開始」ボタンをクリックする
      - 1問目の回答を表示し、「正解」ボタンをクリックする
      - 2問目の回答を表示し、「不正解」ボタンをクリックする
      - 「間違えたところをやり直す」ボタンをクリックする
    expect:
      - 結果画面（#/result）に「正解率: 50%」が表示される
      - 古文単語330の教材IDを含む履歴キーで正解・不正解が保存される
      - 再挑戦では2問目の見出し語だけが出題される

  - id: QUIZ-007
    category: normal
    status: done
    scenario: スマートフォンで古文の長い回答を縦スクロールしても判定されず、左右スワイプで判定される
    precondition: 回答画面がスクロール可能な長さになる2問の古文単語330の session が保存されている状態
    steps:
      - スマートフォン相当の画面（390x844、タッチ有効、モバイル）で出題画面を開く
      - 1問目の回答を表示し、実タッチ操作で縦方向にスクロールする
      - 縦方向にブレながら左へ大きくスワイプする
      - 2問目の回答を表示し、右へ大きくスワイプする
    expect:
      - 縦スクロールでページがスクロールし、回答結果は更新されない
      - 左スワイプで不正解として2問目へ進む
      - 右スワイプで正解として結果画面へ進む

  - id: QUIZ-201
    category: error
    status: done
    scenario: 保存された古文単語330の session が不正な場合はトップへ戻って理由を表示し、保存データを削除しない
    precondition: 単語データが欠けた古文単語330の session が保存されている状態
    steps:
      - 出題画面（#/quiz）を直接開く
    expect:
      - トップページ（#/）へ戻る
      - 「保存されている古文単語330の単語帳を再開できません」を含む通知が表示される
      - 保存されている session が削除されない

  - id: QUIZ-301
    category: boundary
    status: done
    scenario: 改行やHTML風の文字列を含む古文データをプレーンテキストのまま表示する
    precondition: 古文単語330の 0001.json の意味にHTML風の文字列、例文に改行がモックされた状態
    steps:
      - アプリのトップページを開く
      - 教材で「古文単語330」を選択する
      - 開始番号に「1」、終了番号に「1」を入力する
      - 「開始」ボタンをクリックする
      - 問題カードをクリックして回答を表示する
    expect:
      - HTML風の文字列がタグとして解釈されずにそのまま表示される
      - 例文の改行が表示上も保持される
