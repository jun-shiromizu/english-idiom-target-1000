name: Required PR Checks

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  required-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Unit test
        run: npx vitest run

      - name: E2E test
        run: npm run test:e2e

      - name: Build
        run: npm run build

  publish-required-status:
    runs-on: ubuntu-latest
    needs: required-checks
    if: ${{ always() }}
    steps:
      - name: Publish required branch protection status
        uses: actions/github-script@v9
        with:
          script: |
            const state = '${{ needs.required-checks.result }}' === 'success' ? 'success' : 'failure'
            const description = state === 'success'
              ? 'Required PR checks passed'
              : 'Required PR checks failed'
            const sha = context.payload.pull_request?.head?.sha ?? context.sha

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'required-pr-checks',
              description,
            })