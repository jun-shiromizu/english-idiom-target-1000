name: Required PR Checks

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  required-checks:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Unit test
        run: npx vitest run

      - name: Start dev server for E2E
        run: |
          npx vite --host 127.0.0.1 --port 4173 --strictPort > /tmp/vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:4173/english-idiom-target-1000/" > /dev/null; then
              echo "Vite server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Vite server did not start in time"
          cat /tmp/vite.log
          exit 1

      - name: E2E test
        env:
          BASE_URL: http://127.0.0.1:4173/english-idiom-target-1000/
        run: npm run test:e2e

      - name: Build
        run: npm run build

  publish-required-status:
    runs-on: ubuntu-latest
    needs: required-checks
    if: ${{ always() }}
    steps:
      - name: Publish required branch protection status
        uses: actions/github-script@v9
        with:
          script: |
            const state = '${{ needs.required-checks.result }}' === 'success' ? 'success' : 'failure'
            const description = state === 'success'
              ? 'Required PR checks passed'
              : 'Required PR checks failed'
            const sha = context.payload.pull_request?.head?.sha ?? context.sha

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'required-pr-checks',
              description,
            })
